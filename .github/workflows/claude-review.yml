---
name: Claude PR Review

# ─────────────────────────────────────────────────────────────────────
# Automated code review by Claude.
#
# The review method (reading scope, criteria, PHP 5.6 / PS 1.6→9 compatibility
# checklist, classification, section limits, output format) lives in
# .claude/agents/code-review.md — single source of truth, also usable locally.
# This workflow only supplies the execution context (mode, PR number, SHAs).
#
# Trigger: label "need-claude-review" on a PR.
#   - First labeling  → review initiale (full diff)
#   - Second labeling → re-review (new commits only, max 1)
#
# The label is removed after each review so it can be re-added.
# Limits: max 2 reviews per PR (initial + one re-review).
#
# The bot NEVER approves nor requests changes: every review is posted with
# `gh pr review --comment`, and the verdict lives in the body only.
# An approval from the bot would count toward the approvals required on main,
# where only a human review should validate; a `--request-changes` would block
# the merge with no way for the bot to withdraw it once the review quota is
# spent.
#
# Pre-requisites (manual, one-time):
#   - Create repo secret ACCOUNT_ANTHROPIC_API_KEY
#   - Create label "need-claude-review" in the repository
# ─────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    if: >-
      github.event.label.name == 'need-claude-review'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # ── Step 1: Resolve PR context + enforce review limits ──
      - name: Resolve context
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER_RE = /<!-- claude-review-done:([a-f0-9]+) -->/;
            const prNumber = context.payload.pull_request.number;

            // Fetch existing reviews and find Claude markers
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const markers = reviews
              .filter(r => r.body && MARKER_RE.test(r.body))
              .map(r => ({ sha: r.body.match(MARKER_RE)[1] }));

            const reviewCount = markers.length;
            const isReReview = reviewCount > 0;

            // ── Quota reached: block ──
            if (reviewCount >= 2) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '> **Claude review** — le nombre maximum de reviews (2) a ete atteint pour cette PR.',
              });
              core.setOutput('skip', 'true');
              return;
            }

            // Fetch PR head info
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // ── Re-review: block if no new commits since last review ──
            if (isReReview && markers[markers.length - 1].sha === pr.head.sha) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '> **Claude review** — aucun nouveau commit depuis la derniere review. Poussez des corrections avant de re-ajouter le label.',
              });
              core.setOutput('skip', 'true');
              return;
            }

            if (isReReview) {
              core.setOutput('since_sha', markers[markers.length - 1].sha);
            }

            core.setOutput('skip', 'false');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('is_re_review', String(isReReview));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);

      # ── Step 2: Checkout PR branch ──
      - name: Checkout repository
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.head_ref }}
          fetch-depth: 0

      # ── Step 3: Run Claude review ──
      - name: Run Claude Code review
        if: steps.ctx.outputs.skip != 'true'
        uses: anthropics/claude-code-action@b47fd721da662d48c5680e154ad16a73ed74d2e0 # v1
        with:
          anthropic_api_key: ${{ secrets.ACCOUNT_ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools
            "Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep,Write"
          prompt: |
            Tu es un reviewer senior pour le module PrestaShop ps_accounts.
            Reponds ENTIEREMENT en francais.

            ## Methode (OBLIGATOIRE)

            Lis `.claude/agents/code-review.md` avec Read et applique-le **integralement** :
            c'est la source unique de la methode de review (perimetre de lecture, criteres,
            checklist compatibilite PHP 5.6 / PS 1.6→9, classification, limites par section,
            format et action finale). Ce prompt ne fournit que le contexte d'execution ci-dessous.
            En cas de divergence entre ce prompt et l'agent, l'agent gagne.
            Si le fichier est absent (branche partie de `main` avant son introduction),
            lis-le sur main : `git show origin/main:.claude/agents/code-review.md`.

            Tu tournes en **mode PR** au sens du paragraphe 1 de l'agent.

            ## Contexte d'execution

            - Mode : ${{ steps.ctx.outputs.is_re_review == 'true' && 'RE-REVIEW' || 'REVIEW INITIALE' }}
            - PR number (pour les commandes gh uniquement, NE PAS inclure dans le titre) : ${{ steps.ctx.outputs.pr_number }}
            - HEAD SHA (a mettre dans la balise finale) : ${{ steps.ctx.outputs.head_sha }}
            ${{ steps.ctx.outputs.is_re_review == 'true' && format('- SHA de la review precedente : {0}', steps.ctx.outputs.since_sha) || '' }}

            ${{ steps.ctx.outputs.is_re_review == 'true' && format('Recupere le diff avec `git log {0}..HEAD --oneline` puis `git diff {0}..HEAD` (UNIQUEMENT les nouveaux changements), et lis la review precedente avec `gh pr view {1} --comments` pour statuer sur chaque remarque.', steps.ctx.outputs.since_sha, steps.ctx.outputs.pr_number) || format('Recupere le diff complet avec `gh pr diff {0}`.', steps.ctx.outputs.pr_number) }}

      # ── Step 4: Always remove label so it can be re-added for re-review ──
      - name: Remove need-claude-review label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'need-claude-review',
              });
            } catch (e) {
              // Label already removed — ignore
            }
